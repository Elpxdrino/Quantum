services:
  - type: worker
    name: quantum-edge-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: bot-data
      mountPath: /opt/render/project/src
      sizeGB: 1
